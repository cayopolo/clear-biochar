<!DOCTYPE html>
<html>
<head>
    <title>{{ title }}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #2c5f2d 0%, #97bc62 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .content {
            background-color: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        h1 {
            color: #333;
            font-size: 32px;
            margin-bottom: 30px;
            line-height: 1.4;
            text-align: center;
        }
        .table-wrapper {
            overflow-x: auto;
            margin-bottom: 40px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th {
            background-color: #2c5f2d;
            color: white;
            padding: 12px;
            text-align: left;
            font-weight: bold;
            white-space: nowrap;
            border-right: 1px solid #97bc62;
        }
        th:last-child {
            border-right: none;
        }
        td {
            padding: 12px;
            border-bottom: 1px solid #e0e0e0;
            border-right: 1px solid #f0f0f0;
        }
        td:last-child {
            border-right: none;
        }
        tr:hover {
            background-color: #f5f5f5;
        }
        tr:last-child td {
            border-bottom: none;
        }
        .question-section {
            text-align: center;
            padding-top: 20px;
            border-top: 2px solid #e0e0e0;
        }
        .question-text {
            font-size: 20px;
            margin-bottom: 30px;
            color: #333;
        }
        .button-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 20px;
        }
        .answer-button {
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
            display: inline-block;
        }
        .yes-button {
            background-color: #4CAF50;
            color: white;
        }
        .yes-button:hover {
            background-color: #45a049;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.4);
        }
        .no-button {
            background-color: #f44336;
            color: white;
        }
        .no-button:hover {
            background-color: #da190b;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(244, 67, 54, 0.4);
        }
        .home-link {
            display: block;
            text-align: center;
            color: #2c5f2d;
            text-decoration: none;
            font-size: 14px;
            margin-top: 20px;
        }
        .home-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="content">
            <h1>{{ title }}: Annex II Checklist</h1>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            {% for col in column_names %}
                            <th>{{ col }}</th>
                            {% endfor %}
                        </tr>
                    </thead>
                    <tbody>
                        {% for row in table_data %}
                        <tr>
                            {% for col in column_names %}
                            <td>{{ row[col] }}</td>
                            {% endfor %}
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>

            <div class="question-section">
                <p class="question-text">{{ question }}</p>
                <div class="button-container">
                    <a href="{{ yes_url }}" class="answer-button yes-button">Yes</a>
                    <a href="{{ no_url }}" class="answer-button no-button">No</a>
                </div>
                <a href="{{ url_for('home') }}" class="home-link">← Back to Home</a>
            </div>
        </div>
    </div>
</body>
</html>
